name: Test basic dry-run
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repo-token: ${{ github.token }}
          days-before-stale: "120"
          days-before-delete: "180"
          dry-run: "true"
          ignore-issue-interaction: "true"
          max-issues: "5"
          rate-limit: "true"
          pr-check: "false"
      - name: Assert outputs exist
        env:
          DELETED: ${{ steps.action.outputs.deleted-branches }}
          STALE: ${{ steps.action.outputs.stale-branches }}
        run: |
          echo "deleted-branches: $DELETED"
          echo "stale-branches: $STALE"
          echo "PASS: action completed successfully in dry-run mode"
