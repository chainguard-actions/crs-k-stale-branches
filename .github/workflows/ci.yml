name: 'CI'
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  Lint:
    name: Format & Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Print GitHub event action
        env:
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
        run: |
          echo "$GITHUB_EVENT_ACTION"
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci --no-progress --ignore-scripts=false

      - name: Audit Dependencies
        run: npm run audit
      
      - name: Format
        run: 'npm run format'
      
      - name: Lint
        run: 'npm run lint'

  Test-Unit:
    name: Test - Unit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Print GitHub event action
        env:
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
        run: |
          echo "$GITHUB_EVENT_ACTION"
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci --no-progress --ignore-scripts=false
      
      - name: Test
        run: 'npm run test'

  Test-Action: # make sure the action works on a clean machine without building
    name: Test - Action
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: ${{ github.actor != 'dependabot[bot]' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./
        with:
          repo-token: '${{ secrets.ADMINPAT }}'
          days-before-stale: 1
          days-before-delete: 200
          comment-updates: true
          max-issues: 30
          tag-committer: true
          stale-branch-label: 'stale branch 🗑️'
          compare-branches: 'info'
          branches-filter-regex: '^((?!dependabot))'
          pr-check: true        
          dry-run: false
          ignore-issue-interaction: false


  Build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [Lint, Test-Unit, Test-Action]
    steps:
      - name: Print GitHub event action
        env:
          GITHUB_EVENT_ACTION: ${{ github.event.action }}
        run: |
          echo "$GITHUB_EVENT_ACTION"

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci --no-progress --ignore-scripts=false
      
      - name: Build
        run: 'npm run build && npm run package'
